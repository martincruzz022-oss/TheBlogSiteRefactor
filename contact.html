    <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact Us - The Blog Site</title>

  <link href="style.css" rel="stylesheet" type="text/css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

  <!-- Header -->
  <header class="container-fluid bg-dark text-white text-center py-4">
    <h1 class="display-5 fw-bold">The Blog Site</h1>
  </header>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

      <button class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarContent"
              aria-controls="navbarContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html">
              About Us
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active"
               aria-current="page"
               href="contact.html">
              Contact Us
            </a>
          </li>

        </ul>

      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="container-fluid py-4">

    <div class="row g-4">

      <!-- Advertisement -->
      <aside class="col-md-2">
        <div class="card h-100 text-center">

          <div class="card-header bg-secondary text-white">
            Advertisement
          </div>

          <div class="card-body d-flex align-items-center justify-content-center">
            <p class="text-muted mb-0">
              AD
            </p>
          </div>

        </div>
      </aside>

      <!-- Contact form -->
      <section class="col-md-8">

        <div class="card h-100">

          <div class="card-body">

            <h2 class="card-title text-primary mb-4">
              Contact Us
            </h2>

            <!-- Contact form -->
            <form id="contactForm">

              <div class="mb-3">
                <label for="email" class="form-label">
                  Email address
                </label>

                <input type="email"
                       class="form-control"
                       id="email"
                       placeholder="name@example.com"
                       required>
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">
                  Message
                </label>

                <textarea class="form-control"
                          id="message"
                          rows="6"
                          placeholder="Write your message here..."
                          required></textarea>
              </div>

              <button type="submit" class="btn btn-primary">
                Send Message
              </button>

            </form>

            <!-- Alert -->
            <div id="messageAlert"
                 class="alert alert-success alert-dismissible fade mt-4"
                 role="alert">
              <strong>Message sent!</strong>
              Your message has been sent successfully.

              <button type="button"
                      class="btn-close"
                      data-bs-dismiss="alert"
                      aria-label="Close">
              </button>
            </div>

          </div>

        </div>

      </section>

      <!-- News -->
      <aside class="col-md-2">
        <div class="card h-100">

          <div class="card-header bg-secondary text-white text-center">
            News
          </div>

          <div class="card-body">

            <h5 class="card-title">
              Latest News
            </h5>

          </div>

        </div>
      </aside>

    </div>

  </main>

  <!-- Footer -->
  <footer class="container-fluid bg-dark text-white text-center py-4">

    <h5>The Blog Site</h5>

    <p class="mb-1">
      Carlos Martin
    </p>

    <p class="mb-0">
      Email: martincruz.z.022@gmail.com
    </p>

  </footer>

  <script src="script.js"></script>

  <!-- Replit badge -->
  <script src="https://replit.com/public/js/replit-badge-v2.js"
          theme="dark"
          position="bottom-right">
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForClyvwxH9j09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous">
  </script>

</body>

</html>
